  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function go(code,remember){
  var h=await dec(code);
  if(remember){try{sessionStorage.setItem('hana-k',code)}catch(e){}}
  document.open();document.write(h);document.close();
  setTimeout(function(){document.body&&document.body.classList.add('on')},80);
}
(function(){try{var c=sessionStorage.getItem('hana-k');if(c)go(c,false).catch(function(){})}catch(e){}})();
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e');
  var c=document.getElementById('k').value.replace(/[\s-]+/g,'').toUpperCase();
  b.disabled=true;e.textContent='';
  go(c,true).catch(function(){b.disabled=false;e.textContent="Code incorrect. Il vous a été remis avec votre audit."});
});
